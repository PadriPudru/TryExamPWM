<div class="container">
  <h2>{{ isEditMode ? 'Edit' : 'Add' }} Class</h2>

  <form [formGroup]="classForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="name">Name</label>
      <input id="name" formControlName="name" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
      <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">Name is required</div>
    </div>

    <div class="mb-3">
      <label for="difficulty">Difficulty</label>
      <input id="difficulty" formControlName="difficulty" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['difficulty'].errors }">
      <div *ngIf="submitted && f['difficulty'].errors" class="invalid-feedback">Difficulty is required</div>
    </div>

    <button type="submit" class="btn btn-primary me-2">{{ isEditMode ? 'Update' : 'Add' }}</button>
    <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
  </form>
</div>
