<div class="container">
  <h2>Students</h2>
  
  <div class="alert alert-danger" *ngIf="error">
    {{ error }}
  </div>
  
  <div *ngIf="loading" class="text-center">
    <p>Loading students...</p>
  </div>
  
  <div *ngIf="!loading && students.length === 0" class="text-center">
    <p>No students found. Add a new student to get started.</p>
  </div>
  
  <div class="mb-3">
    <a [routerLink]="['/students/new']" class="btn btn-primary">Add New Student</a>
  </div>
  
  <div class="table-responsive" *ngIf="!loading && students.length > 0">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of students">
          <td>{{ student.name }}</td>
          <td>{{ student.email }}</td>
          <td>
            <a [routerLink]="['/students/edit', student.id]" class="btn btn-sm btn-info me-2">Edit</a>
            <button (click)="deleteStudent(student.id!)" class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
