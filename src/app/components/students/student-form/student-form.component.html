<div class="container">
  <h2>{{ isEditMode ? 'Edit' : 'Add' }} Student</h2>
  
  <div class="alert alert-danger" *ngIf="error">
    {{ error }}
  </div>
  
  <div *ngIf="loading" class="text-center">
    <p>Loading...</p>
  </div>
  
  <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input 
        type="text" 
        class="form-control" 
        id="name" 
        formControlName="name" 
        [ngClass]="{ 'is-invalid': submitted && f['name'].errors }"
      >
      <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
        <div *ngIf="f['name'].errors['required']">Name is required</div>
      </div>
    </div>
    
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input 
        type="email" 
        class="form-control" 
        id="email" 
        formControlName="email" 
        [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
      >
      <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
        <div *ngIf="f['email'].errors['required']">Email is required</div>
        <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
      </div>
    </div>
    
    <div class="mb-3">
      <button type="submit" class="btn btn-primary me-2">{{ isEditMode ? 'Update' : 'Add' }}</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
      <a [routerLink]="['/students']" class="btn btn-link">Back to List</a>
    </div>
  </form>
</div>
