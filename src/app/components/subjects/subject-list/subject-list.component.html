<div class="container">
  <h2>Subjects</h2>
  
  <div class="alert alert-danger" *ngIf="error">
    {{ error }}
  </div>
  
  <div *ngIf="loading" class="text-center">
    <p>Loading subjects...</p>
  </div>
  
  <div *ngIf="!loading && subjects.length === 0" class="text-center">
    <p>No subjects found. Add a new subject to get started.</p>
  </div>
  
  <div class="mb-3">
    <a [routerLink]="['/subjects/new']" class="btn btn-primary">Add New Subject</a>
  </div>
  
  <div class="table-responsive" *ngIf="!loading && subjects.length > 0">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let subject of subjects">
          <td>{{ subject.name }}</td>
          <td>{{ subject.description }}</td>
          <td>
            <a [routerLink]="['/subjects/edit', subject.id]" class="btn btn-sm btn-info me-2">Edit</a>
            <button (click)="deleteSubject(subject.id!)" class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
