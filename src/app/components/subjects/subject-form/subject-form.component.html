<div class="container">
  <h2>{{ isEditMode ? 'Edit' : 'Add' }} Subject</h2>
  
  <div class="alert alert-danger" *ngIf="error">
    {{ error }}
  </div>
  
  <div *ngIf="loading" class="text-center">
    <p>Loading...</p>
  </div>
  
  <form [formGroup]="subjectForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input 
        type="text" 
        class="form-control" 
        id="name" 
        formControlName="name" 
        [ngClass]="{ 'is-invalid': submitted && f['name'].errors }"
      >
      <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
        <div *ngIf="f['name'].errors['required']">Name is required</div>
      </div>
    </div>
    
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea 
        class="form-control" 
        id="description" 
        formControlName="description" 
        rows="3"
        [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"
      ></textarea>
      <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
        <div *ngIf="f['description'].errors['required']">Description is required</div>
      </div>
    </div>
    
    <div class="mb-3">
      <button type="submit" class="btn btn-primary me-2">{{ isEditMode ? 'Update' : 'Add' }}</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
      <a [routerLink]="['/subjects']" class="btn btn-link">Back to List</a>
    </div>
  </form>
</div>
